x-app: &app
  build:
    context: .
    target: dev
  volumes:
    - .:/var/www/html
    - vendor:/var/www/html/vendor
  environment:
    DB_HOST: mysql
    DB_PORT: 3306
    DB_DATABASE: video_intelligence_platform
    DB_USERNAME: laravel
    DB_PASSWORD: secret
    REDIS_HOST: redis
    REDIS_PORT: 6379
    XDEBUG_MODE: ${XDEBUG_MODE:-debug,develop}
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_started

services:
  app:
    <<: *app
    ports:
      - "8000:80"

  worker:
    <<: *app
    command: php artisan queue:listen --tries=1

  vite:
    image: node:22-bookworm
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: video_intelligence_platform
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root_secret
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_secret"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data

volumes:
  vendor:
  node_modules:
  mysql-data:
  redis-data:
