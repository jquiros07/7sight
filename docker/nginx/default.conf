server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    index index.php;

    client_max_body_size 550M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # Default (60s) is too short for clip creation, which re-encodes with
        # ffmpeg synchronously in-request and can take several minutes for a
        # long clip - matches CreateVideoFromRecordingClip's Process timeout.
        fastcgi_read_timeout 600s;
        include fastcgi_params;
        # The distro's fastcgi_params forces HTTP_HOST to $host (port-stripped) as a
        # Host-header-confusion hardening. This app is single-tenant behind a plain
        # Docker port remap (no proxy chain to confuse), and needs the real port for
        # correct absolute URLs (redirects, signed links), so restore it here, after
        # the include so this line wins.
        fastcgi_param HTTP_HOST $http_host;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
