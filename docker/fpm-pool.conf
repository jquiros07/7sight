; Production only. Loaded after the base image's www.conf (filename sorts last),
; so these directives override it. Defaults sized for ~1-1.5GB dedicated to PHP —
; adjust pm.max_children to (RAM allocated to PHP) / (~30-50MB per worker).
[www]
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
